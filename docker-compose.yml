services: 
  postgres:
    image: postgres:16-alpine
    container_name: clinica_postgres
    ports:
      - "5432:5432" # minha porta : porta do container
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: clinica
    volumes:
      - postgres_data:/var/lib/postgresql/data
volumes:
  postgres_data:
